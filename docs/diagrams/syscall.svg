<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <title id="title">A synchronous syscall, step by step</title>
  <desc id="desc">A process calls fs.readFileSync. It writes the request into its shared channel and blocks in Atomics.wait. The notify wakes the kernel worker, which is parked on the channel with Atomics.waitAsync. The kernel reads the file from the in-memory filesystem, writes the reply and notifies. The process wakes, copies the bytes out and returns. A round trip takes about 10 microseconds.</desc>
  <defs>
    <style>
      .t { font: 600 25px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -.01em; fill: #fff }
      .s { font: 400 18px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #ffffffd9 }
      .l { font: 500 19px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #e4e4e7 }
      .m { font: 400 16px 'JetBrains Mono', ui-monospace, Menlo, monospace; fill: #a1a1aa }
      .n { font: 600 15px 'JetBrains Mono', ui-monospace, Menlo, monospace; fill: #08080a }
      .amber { fill: #f2c47a }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05" />
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 1.5 10 6 2 10.5" fill="none" stroke="#b7cdff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#08080a" />
  <rect width="1000" height="640" fill="url(#grid)" />
  <rect x="10" y="10" width="980" height="620" rx="20" fill="#0e0e11" stroke="#ffffff24" />

  <!-- lane headers -->
  <rect x="30" y="34" width="190" height="96" rx="12" fill="#3a4fb5" />
  <text x="50" y="74" class="t">Process</text>
  <text x="50" y="106" class="s">readFileSync()</text>

  <rect x="280" y="34" width="190" height="96" rx="12" fill="#18181c" stroke="#f2c47a" stroke-opacity=".6" />
  <text x="300" y="74" class="t">Channel</text>
  <text x="300" y="106" class="m amber">shared memory</text>

  <rect x="530" y="34" width="190" height="96" rx="12" fill="#1c7556" />
  <text x="550" y="74" class="t">Kernel</text>
  <text x="550" y="106" class="s">SyscallServer</text>

  <rect x="780" y="34" width="190" height="96" rx="12" fill="#18181c" stroke="#ffffff24" />
  <text x="800" y="74" class="t">Filesystem</text>
  <text x="800" y="106" class="s" fill="#a1a1aa">in memory</text>

  <!-- lifelines -->
  <path d="M125 134v436M375 134v436M625 134v436M875 134v436" stroke="#ffffff24" stroke-width="2" stroke-dasharray="4 8" />

  <!-- the blocked process -->
  <rect x="115" y="190" width="20" height="344" rx="4" fill="#f2c47a" fill-opacity=".22" stroke="#f2c47a" stroke-opacity=".6" />
  <text x="150" y="344" class="m amber">blocked in</text>
  <text x="150" y="368" class="m amber">Atomics.wait</text>

  <!-- the kernel at work -->
  <rect x="615" y="258" width="20" height="204" rx="4" fill="#7be3b4" fill-opacity=".2" stroke="#7be3b4" stroke-opacity=".6" />

  <!-- 1 -->
  <circle cx="160" cy="172" r="14" fill="#b7cdff" /><text x="160" y="177" class="n" text-anchor="middle">1</text>
  <text x="184" y="179" class="l">write request</text>
  <path d="M137 198h232" stroke="#b7cdff" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 2 -->
  <circle cx="410" cy="230" r="14" fill="#b7cdff" /><text x="410" y="235" class="n" text-anchor="middle">2</text>
  <text x="434" y="237" class="l">notify, wake</text>
  <path d="M381 256h228" stroke="#b7cdff" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 3 -->
  <circle cx="660" cy="288" r="14" fill="#b7cdff" /><text x="660" y="293" class="n" text-anchor="middle">3</text>
  <text x="684" y="295" class="l">read the file</text>
  <path d="M637 314h232" stroke="#b7cdff" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M869 362h-232" stroke="#b7cdff" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)" />
  <text x="684" y="350" class="m">bytes</text>

  <!-- 4 -->
  <circle cx="410" cy="420" r="14" fill="#b7cdff" /><text x="410" y="425" class="n" text-anchor="middle">4</text>
  <text x="434" y="427" class="l">reply, notify</text>
  <path d="M609 446h-228" stroke="#b7cdff" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 5 -->
  <circle cx="160" cy="494" r="14" fill="#b7cdff" /><text x="160" y="499" class="n" text-anchor="middle">5</text>
  <text x="184" y="501" class="l">copy out, return</text>
  <path d="M369 520h-232" stroke="#b7cdff" stroke-width="2.5" marker-end="url(#arrow)" />

  <text x="30" y="604" class="m">≈10 µs per round trip · large payloads stream in 256 KiB chunks</text>
</svg>
