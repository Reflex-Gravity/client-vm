<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <title id="title">What you deploy, and where</title>
  <desc id="desc">Your app stays on its own domain and needs no special headers. Across a cross-site boundary, the sandbox is one static deployment of @clientvm/sandbox-host on a wildcard subdomain of a separate registrable domain, with one subdomain per instance and one per preview port. Every sandbox response carries Document-Isolation-Policy, COEP, CORP and a frame-ancestors CSP. Deploy it with npm and check it with clientvm-check-sandbox.</desc>
  <defs>
    <style>
      .cap { font: 500 15px 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: .06em; fill: #8b8b95 }
      .t { font: 600 25px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -.01em; fill: #fafafa }
      .s { font: 400 19px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #a1a1aa }
      .m { font: 400 16px 'JetBrains Mono', ui-monospace, Menlo, monospace; fill: #8b8b95 }
      .h { font: 400 16px 'JetBrains Mono', ui-monospace, Menlo, monospace; fill: #d4d4d8 }
      .chip { font: 400 15px 'JetBrains Mono', ui-monospace, Menlo, monospace; fill: #c9d6ff }
      .amber { fill: #f2c47a } .green { fill: #7be3b4 } .blue { fill: #b7cdff } .red { fill: #f6b0aa }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05" />
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 1.5 10 6 2 10.5" fill="none" stroke="#b7cdff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7be3b4" stop-opacity=".16" /><stop offset="1" stop-color="#7be3b4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c47a" stop-opacity=".09" /><stop offset=".5" stop-color="#f2c47a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1000" height="1060" fill="#08080a" />
  <rect width="1000" height="1060" fill="url(#grid)" />

  <!-- your app -->
  <rect x="20" y="20" width="960" height="230" rx="18" fill="url(#g-green)" stroke="#7be3b4" stroke-opacity=".55" />
  <text x="44" y="56" class="cap green">YOUR APP · ANY HOST</text>
  <text x="44" y="100" class="t">myapp.example</text>
  <text x="44" y="132" class="s">your pages, your cookies</text>
  <text x="44" y="186" class="s">Headers you add:</text>
  <text x="44" y="222" class="t green">none</text>
  <rect x="440" y="44" width="516" height="182" rx="12" fill="#18181c" stroke="#ffffff24" />
  <text x="464" y="86" class="m">createClientVM({</text>
  <text x="464" y="118" class="h">  sandboxOrigin: (id) =&gt;</text>
  <text x="464" y="150" class="h">    `https://${id}.myapp-sandbox.dev`</text>
  <text x="464" y="182" class="m">})</text>

  <!-- the boundary -->
  <path d="M20 296h960" stroke="#f28b82" stroke-opacity=".7" stroke-width="2" stroke-dasharray="10 8" />
  <rect x="44" y="279" width="226" height="34" rx="9" fill="#0e0e11" stroke="#f28b82" stroke-opacity=".6" />
  <text x="157" y="301" class="chip red" text-anchor="middle">cross-site boundary</text>

  <path d="M698 228v108" stroke="#b7cdff" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="714" y="279" width="180" height="34" rx="9" fill="#0e0e11" stroke="#ffffff24" />
  <text x="804" y="301" class="chip" text-anchor="middle">hidden iframes</text>

  <!-- the sandbox -->
  <rect x="20" y="340" width="960" height="700" rx="18" fill="url(#g-amber)" stroke="#f2c47a" stroke-opacity=".5" stroke-dasharray="6 6" />
  <text x="44" y="376" class="cap amber">SANDBOX · A SEPARATE REGISTRABLE DOMAIN</text>
  <text x="44" y="420" class="t">*.myapp-sandbox.dev</text>
  <text x="44" y="452" class="s">wildcard DNS + TLS · the same static files on every name · no cookies</text>

  <rect x="44" y="480" width="296" height="150" rx="12" fill="#18181c" stroke="#ffffff24" />
  <text x="68" y="516" class="cap">INSTANCE</text>
  <text x="68" y="552" class="h">k3x9.myapp-sandbox.dev</text>
  <text x="68" y="600" class="s">kernel, processes, files</text>

  <rect x="352" y="480" width="296" height="150" rx="12" fill="#18181c" stroke="#ffffff24" />
  <text x="376" y="516" class="cap">INSTANCE</text>
  <text x="376" y="552" class="h">a1b2.myapp-sandbox.dev</text>
  <text x="376" y="600" class="s">isolated from k3x9</text>

  <rect x="660" y="480" width="296" height="150" rx="12" fill="#18181c" stroke="#8fa8ff" stroke-opacity=".6" />
  <text x="684" y="516" class="cap blue">PREVIEW · PORT 5173</text>
  <text x="684" y="552" class="h">k3x9-p5173.myapp-…</text>
  <text x="684" y="600" class="s">the dev server's pages</text>

  <text x="44" y="676" class="cap">ON EVERY RESPONSE</text>
  <rect x="44" y="692" width="912" height="170" rx="12" fill="#121215" stroke="#ffffff24" />
  <text x="68" y="728" class="h">Document-Isolation-Policy: isolate-and-require-corp</text>
  <text x="68" y="756" class="h">Cross-Origin-Embedder-Policy: require-corp</text>
  <text x="68" y="784" class="h">Cross-Origin-Resource-Policy: cross-origin</text>
  <text x="68" y="812" class="h">Content-Security-Policy: frame-ancestors https://myapp.example</text>
  <text x="68" y="844" class="m">+ Service-Worker-Allowed: / on /__clientvm/sw.js</text>

  <text x="44" y="904" class="cap">DEPLOY AND CHECK</text>
  <rect x="44" y="920" width="912" height="96" rx="12" fill="#121215" stroke="#ffffff24" />
  <text x="68" y="958" class="h">npm i -D @clientvm/sandbox-host   # deploy its dist/</text>
  <text x="68" y="992" class="h green">npx clientvm-check-sandbox 'https://{id}.myapp-sandbox.dev'</text>
</svg>
