<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <title id="title">How ClientVM is laid out in one browser tab</title>
  <desc id="desc">Your page holds your UI, the controller and the terminal and agent tools. Each instance is a hidden iframe on its own sandbox origin, where a kernel worker owns an in-memory filesystem and runs node, bash and other tools as Web Workers that make synchronous syscalls over SharedArrayBuffer. A service worker serves modules and previews. Each open port is previewed on its own origin, which your UI embeds in an iframe. Outbound requests use the browser's fetch.</desc>
  <defs>
    <style>
      .cap { font: 500 15px 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: .06em; fill: #8b8b95 }
      .t { font: 600 25px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -.01em; fill: #fafafa }
      .s { font: 400 19px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #a1a1aa }
      .m { font: 400 16px 'JetBrains Mono', ui-monospace, Menlo, monospace; fill: #8b8b95 }
      .chip { font: 400 15px 'JetBrains Mono', ui-monospace, Menlo, monospace; fill: #c9d6ff }
      .on .t { fill: #fff } .on .s { fill: #ffffffd9 } .on .m { fill: #ffffffa6 }
      .amber { fill: #f2c47a } .green { fill: #7be3b4 } .blue { fill: #b7cdff }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05" />
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 1.5 10 6 2 10.5" fill="none" stroke="#b7cdff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7be3b4" stop-opacity=".18" /><stop offset="1" stop-color="#7be3b4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c47a" stop-opacity=".09" /><stop offset=".5" stop-color="#f2c47a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa8ff" stop-opacity=".16" /><stop offset="1" stop-color="#8fa8ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1000" height="1040" fill="#08080a" />
  <rect width="1000" height="1040" fill="url(#grid)" />

  <!-- the browser tab -->
  <rect x="20" y="20" width="960" height="1000" rx="20" fill="#0e0e11" stroke="#ffffff24" />
  <circle cx="50" cy="52" r="6" fill="#2a2a2e" /><circle cx="70" cy="52" r="6" fill="#2a2a2e" /><circle cx="90" cy="52" r="6" fill="#2a2a2e" />
  <rect x="116" y="36" width="330" height="32" rx="16" fill="#18181c" stroke="#ffffff14" />
  <text x="136" y="57" class="m">your-app.com · one tab</text>

  <!-- host page -->
  <rect x="50" y="96" width="900" height="226" rx="14" fill="#121215" stroke="#ffffff14" />
  <text x="74" y="128" class="cap">HOST PAGE · YOUR ORIGIN · NO COOP/COEP NEEDED</text>

  <rect x="74" y="148" width="272" height="152" rx="12" fill="#18181c" stroke="#ffffff24" />
  <text x="98" y="190" class="t">Terminal &amp; tools</text>
  <text x="98" y="222" class="s">@clientvm/terminal</text>
  <text x="98" y="248" class="s">@clientvm/agent-api</text>
  <text x="98" y="282" class="m">attachShell · tools</text>

  <rect x="362" y="148" width="272" height="152" rx="12" fill="url(#g-green)" stroke="#7be3b4" stroke-opacity=".6" />
  <text x="386" y="190" class="t">Controller</text>
  <text x="386" y="222" class="s">the trusted broker</text>
  <text x="386" y="254" class="m">checks every message</text>
  <text x="386" y="282" class="m green">runs no agent code</text>

  <rect x="650" y="148" width="276" height="152" rx="12" fill="#18181c" stroke="#ffffff24" />
  <text x="674" y="190" class="t">Your app's UI</text>
  <text x="674" y="222" class="s">chat, editor, files</text>
  <text x="674" y="282" class="m">&lt;iframe src={url}&gt;</text>

  <!-- controller ↔ instance -->
  <path d="M498 304v72" stroke="#b7cdff" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <rect x="514" y="326" width="150" height="30" rx="8" fill="#0e0e11" stroke="#ffffff24" />
  <text x="589" y="346" class="chip" text-anchor="middle">MessagePort</text>

  <!-- UI → preview -->
  <path d="M800 304v72" stroke="#b7cdff" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="816" y="326" width="110" height="30" rx="8" fill="#0e0e11" stroke="#ffffff24" />
  <text x="871" y="346" class="chip" text-anchor="middle">iframe</text>

  <!-- instance -->
  <rect x="50" y="380" width="620" height="610" rx="14" fill="url(#g-amber)" stroke="#f2c47a" stroke-opacity=".5" stroke-dasharray="6 6" />
  <text x="74" y="412" class="cap amber">INSTANCE · &lt;id&gt;.sandbox.dev</text>
  <text x="74" y="440" class="m">hidden iframe · cross-origin isolated</text>
  <text x="74" y="478" class="cap">WEB WORKERS · ONE PER PROCESS</text>

  <g class="on">
    <rect x="74" y="490" width="181" height="104" rx="12" fill="#3a4fb5" />
    <path d="M94 510l8 6-8 6M106 524h9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="94" y="556" class="t">Node.js 24</text>
    <text x="94" y="580" class="s">node, npm</text>

    <rect x="269" y="490" width="181" height="104" rx="12" fill="#3a4fb5" />
    <path d="M289 510l8 6-8 6M301 524h9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="289" y="556" class="t">bash</text>
    <text x="289" y="580" class="s">~60 commands</text>

    <rect x="464" y="490" width="182" height="104" rx="12" fill="#3a4fb5" />
    <path d="M484 510l8 6-8 6M496 524h9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="484" y="556" class="t">Your tools</text>
    <text x="484" y="580" class="s">vite, git</text>
  </g>

  <path d="M164 598v38" stroke="#b7cdff" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <path d="M555 598v38" stroke="#b7cdff" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <rect x="252" y="602" width="216" height="30" rx="8" fill="#0e0e11" stroke="#ffffff24" />
  <text x="360" y="622" class="chip" text-anchor="middle">sync syscalls</text>

  <g class="on">
    <rect x="74" y="640" width="572" height="120" rx="12" fill="#1c7556" />
    <rect x="94" y="660" width="24" height="24" rx="5" fill="none" stroke="#fff" stroke-width="2" />
    <path d="M101 656v4M111 656v4M101 684v4M111 684v4M90 667h4M90 677h4M118 667h4M118 677h4" stroke="#fff" stroke-width="2" stroke-linecap="round" />
    <text x="134" y="681" class="t">Kernel worker</text>
    <text x="94" y="716" class="s">processes · terminals · signals · ports</text>
    <text x="94" y="744" class="m">one per instance · enforces limits</text>
  </g>

  <path d="M213 764v36" stroke="#b7cdff" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <path d="M506 764v36" stroke="#b7cdff" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />

  <rect x="74" y="804" width="279" height="136" rx="12" fill="#18181c" stroke="#ffffff24" />
  <path d="M110 826l16 9-16 9-16-9z" fill="#9ff0cc" /><path d="M94 835v18l16 9v-18z" fill="#7be3b4" /><path d="M126 835v18l-16 9v-18z" fill="#3f9e78" />
  <text x="140" y="852" class="t">Filesystem</text>
  <text x="94" y="890" class="s">in memory, snapshots</text>
  <text x="94" y="920" class="m">OPFS persistence</text>

  <rect x="367" y="804" width="279" height="136" rx="12" fill="#18181c" stroke="#ffffff24" />
  <text x="391" y="852" class="t">Service worker</text>
  <text x="391" y="890" class="s">modules and previews</text>
  <text x="391" y="920" class="m">/__clientvm/sw.js</text>

  <text x="74" y="972" class="m amber">agent code and packages run only in here</text>

  <!-- preview -->
  <rect x="700" y="380" width="250" height="300" rx="14" fill="url(#g-blue)" stroke="#8fa8ff" stroke-opacity=".55" />
  <text x="720" y="412" class="cap blue">PREVIEW ORIGIN</text>
  <text x="720" y="440" class="m">&lt;id&gt;-p5173.…</text>
  <rect x="720" y="460" width="210" height="110" rx="12" fill="#18181c" stroke="#ffffff24" />
  <text x="740" y="504" class="t">Agent's app</text>
  <text x="740" y="538" class="s">dev server, HMR</text>
  <text x="720" y="612" class="s">One origin per port,</text>
  <text x="720" y="638" class="s">served by its own</text>
  <text x="720" y="664" class="s">service worker.</text>

  <!-- preview → service worker -->
  <path d="M698 600h-12q-8 0-8 8v256q0 8-8 8h-20" fill="none" stroke="#b7cdff" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- outside world -->
  <rect x="700" y="710" width="250" height="280" rx="14" fill="#121215" stroke="#ffffff14" />
  <text x="720" y="742" class="cap">OUTSIDE THE TAB</text>
  <circle cx="746" cy="796" r="26" fill="none" stroke="#d4d4d8" stroke-width="2" />
  <ellipse cx="746" cy="796" rx="11" ry="26" fill="none" stroke="#d4d4d8" stroke-width="2" />
  <path d="M720 796h52M725 783h42M725 809h42" stroke="#d4d4d8" stroke-width="2" />
  <text x="720" y="868" class="t">npm &amp; the web</text>
  <text x="720" y="900" class="s">via browser fetch()</text>
  <text x="720" y="940" class="m">CORS rules apply</text>
  <text x="720" y="966" class="m">no raw TCP</text>
</svg>
