name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    # Pinned, not ubuntu-latest: the shell differential tests diff against the
    # runner's bash and coreutils, and ClientVM targets bash 5.2 and GNU coreutils
    # as shipped in Ubuntu 24.04. Newer images ship bash 5.3 and uutils, whose
    # messages differ (docs/compatibility.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:spdx
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @clientvm/site build

  e2e:
    name: Chromium e2e + benchmarks
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm bench
      - name: Benchmark regression gate
        run: node scripts/bench-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            bench-results.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
