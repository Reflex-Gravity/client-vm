name: Site

# Builds site/ (the landing page, live demo and docs) and publishes it to
# Cloudflare Pages (project clientvm-site) at https://clientvm.joeldsouza.me.
# The demo's sandbox is deployed separately (sandbox.yml). Needs the
# CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/**'
      # The site publishes the user-facing docs as pages under /docs/.
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clientvm/site build
        env:
          PUBLIC_SANDBOX: 'https://{id}-cvm.joeldsouza.me'
      # wrangler is pinned in deploy/sandbox-worker; reuse it rather than add another copy.
      - name: Deploy
        run: >-
          pnpm --filter @clientvm/sandbox-worker exec wrangler pages deploy
          "$GITHUB_WORKSPACE/site/dist" --project-name=clientvm-site --branch=main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
