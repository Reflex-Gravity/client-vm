name: npm smoke (top packages)

# The full npm smoke run (CLAUDE.md §9, test/e2e/smoke-full.spec.ts): the
# most-downloaded packages installed and loaded inside ClientVM. It needs
# about an hour of registry traffic, so it runs weekly and on demand, not on
# every pull request. The JSON report is uploaded as an artifact.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many packages from the top (empty: all of test/conformance/npm-top.json)'
        required: false
        default: ''
      min_pass:
        description: 'Fail below this share of loadable packages (0 to 1)'
        required: false
        default: '0.97'

permissions:
  contents: read

jobs:
  smoke:
    name: Install and load the top npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=e2e test/e2e/smoke-full.spec.ts
        env:
          CLIENTVM_SMOKE_FULL: '1'
          CLIENTVM_SMOKE_LIMIT: ${{ inputs.limit }}
          CLIENTVM_SMOKE_MIN_PASS: ${{ inputs.min_pass || '0.97' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-full-results
          path: |
            smoke-full-results.json
            playwright-report/
          if-no-files-found: ignore
